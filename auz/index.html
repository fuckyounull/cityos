<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Auzatic | Sin City</title>
  <meta name="description" content="Official Auzatic profile — Sin City COO.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #050507;
      --glass: rgba(18, 18, 24, 0.68);
      --glass-border: rgba(255, 255, 255, 0.09);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.55);
      --accent: #a855f7;
      --accent2: #7c3aed;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: "Inter", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(168,85,247,.13), transparent 35%),
        radial-gradient(circle at 80% 70%, rgba(124,58,237,.12), transparent 35%),
        #050507;
      color: white;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 30px 16px;
    }

    #particles {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .cursor-light {
      position: fixed;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(168,85,247,.12),
        transparent 65%
      );
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
      transition: opacity .3s ease;
    }

    .page {
      width: 100%;
      max-width: 510px;
      position: relative;
      z-index: 2;
    }

    .profile-card {
      position: relative;
      overflow: hidden;

      background: linear-gradient(
        145deg,
        rgba(25,25,34,.82),
        rgba(10,10,15,.72)
      );

      border: 1px solid var(--glass-border);
      border-radius: 28px;

      padding: 38px 28px 28px;

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      box-shadow:
        0 30px 80px rgba(0,0,0,.6),
        inset 0 1px rgba(255,255,255,.04);

      opacity: 0;
      transform: translateY(30px) scale(.97);
      animation: cardIn .8s cubic-bezier(.16,1,.3,1) forwards;
    }

    @keyframes cardIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .profile-card::before {
      content: "";
      position: absolute;
      width: 280px;
      height: 280px;
      top: -180px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      filter: blur(110px);
      opacity: .17;
      pointer-events: none;
    }

    .profile {
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .avatar-wrap {
      position: relative;
      display: inline-flex;
      margin-bottom: 18px;
    }

    .avatar-glow {
      position: absolute;
      inset: -7px;
      border-radius: 50%;
      background: linear-gradient(
        135deg,
        #c084fc,
        #7c3aed,
        #4c1d95
      );
      filter: blur(8px);
      opacity: .55;
    }

    .avatar {
      position: relative;
      width: 112px;
      height: 112px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.14);
      background: #101014;
      z-index: 1;

      box-shadow:
        0 15px 35px rgba(0,0,0,.45);
    }

    .status {
      position: absolute;
      right: 7px;
      bottom: 7px;

      width: 22px;
      height: 22px;
      border-radius: 50%;

      background: #23a55a;

      border: 4px solid #111117;

      z-index: 3;

      box-shadow:
        0 0 0 3px rgba(35,165,90,.12),
        0 0 18px rgba(35,165,90,.35);
    }

    .name-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .verified {
      color: #a855f7;
      font-size: 19px;
    }

    .handle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }

    .role {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      margin-top: 15px;

      padding: 7px 12px;

      border-radius: 999px;

      font-size: 12px;
      font-weight: 700;

      color: #d8b4fe;

      background: rgba(168,85,247,.1);
      border: 1px solid rgba(168,85,247,.18);
    }

    .bio {
      margin: 20px auto 4px;

      max-width: 370px;

      color: rgba(255,255,255,.69);

      font-size: 14px;
      line-height: 1.65;
    }

    .divider {
      height: 1px;
      background: rgba(255,255,255,.07);
      margin: 27px 0 22px;
    }

    .social-title {
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: 800;
      color: rgba(255,255,255,.35);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .socials {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .social {
      position: relative;

      display: flex;
      align-items: center;

      width: 100%;

      padding: 14px 16px;

      text-decoration: none;

      color: white;

      border-radius: 15px;

      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.07);

      overflow: hidden;

      transition:
        transform .25s ease,
        background .25s ease,
        border-color .25s ease;
    }

    .social::before {
      content: "";
      position: absolute;

      inset: 0;

      background: linear-gradient(
        90deg,
        rgba(168,85,247,.12),
        transparent
      );

      opacity: 0;
      transition: opacity .25s ease;
    }

    .social:hover {
      transform: translateY(-2px);
      border-color: rgba(168,85,247,.28);
      background: rgba(168,85,247,.07);
    }

    .social:hover::before {
      opacity: 1;
    }

    .social-icon {
      width: 38px;
      height: 38px;

      border-radius: 11px;

      display: grid;
      place-items: center;

      background: rgba(255,255,255,.055);

      font-size: 18px;

      margin-right: 13px;

      z-index: 2;
    }

    .social-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      z-index: 2;
    }

    .social-name {
      font-size: 13px;
      font-weight: 700;
    }

    .social-handle {
      font-size: 11px;
      color: rgba(255,255,255,.4);
    }

    .arrow {
      margin-left: auto;
      color: rgba(255,255,255,.22);
      font-size: 12px;
      z-index: 2;

      transition:
        transform .25s ease,
        color .25s ease;
    }

    .social:hover .arrow {
      transform: translateX(3px);
      color: #c084fc;
    }

    .views {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;

      margin-top: 23px;

      color: rgba(255,255,255,.3);

      font-size: 11px;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      font-size: 10px;
      color: rgba(255,255,255,.2);
      letter-spacing: .8px;
    }

    .footer a {
      color: rgba(255,255,255,.38);
      text-decoration: none;
    }

    @media (max-width: 550px) {
      body {
        padding: 20px 12px;
      }

      .profile-card {
        border-radius: 23px;
        padding: 32px 18px 24px;
      }

      .avatar {
        width: 98px;
        height: 98px;
      }

      h1 {
        font-size: 27px;
      }

      .cursor-light {
        display: none;
      }
    }
  </style>
</head>

<body>

<canvas id="particles"></canvas>
<div class="cursor-light" id="cursorLight"></div>

<main class="page">

  <section class="profile-card">

    <div class="profile">

      <div class="avatar-wrap">
        <div class="avatar-glow"></div>

        <!--
          PUT AUZ'S PROFILE PICTURE IN THE SAME FOLDER
          AND NAME IT auz.png
        -->
        <img
          src="auz.png"
          alt="Auzatic"
          class="avatar"
        >

        <div class="status" title="Online"></div>
      </div>

      <div class="name-row">
        <h1>Auzatic</h1>
        <i class="fa-solid fa-circle-check verified"></i>
      </div>

      <div class="handle">@auzatic</div>

      <div class="role">
        <i class="fa-solid fa-crown"></i>
        SIN CITY COO
      </div>

      <p class="bio">
        COO of Sin City. Find all of Auzatic's official socials below.
      </p>

    </div>

    <div class="divider"></div>

    <div class="social-title">Socials</div>

    <div class="socials">

      <a
        href="https://www.tiktok.com/@auzatic"
        target="_blank"
        class="social"
      >
        <div class="social-icon">
          <i class="fa-brands fa-tiktok"></i>

        <div class="social-info">

        </div>

        <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
      </a>


      <a
        href="https://www.instagram.com/auzatic"
        target="_blank"
        class="social"
      >
        <div class="social-icon">
          <i class="fa-brands fa-instagram"></i>
        </div>

        <div class="social-info">
          <span class="social-name">Instagram</span>
          <span class="social-handle">@auzatic</span>
        </div>

        <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
      </a>


      <a
        href="https://www.twitch.tv/auzatic"
        target="_blank"
        class="social"
      >
        <div class="social-icon">
          <i class="fa-brands fa-twitch"></i>
        </div>

        <div class="social-info">
          <span class="social-name">Twitch</span>
          <span class="social-handle">@auzatic</span>
        </div>

        <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
      </a>


      <a
        href="https://x.com/auzatic"
        target="_blank"
        class="social"
      >
        <div class="social-icon">
          <i class="fa-brands fa-x-twitter"></i>
        </div>

        <div class="social-info">
          <span class="social-name">X</span>
          <span class="social-handle">@auzatic</span>
        </div>

        <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
      </a>


      <a
        href="https://www.youtube.com/@auzatic"
        target="_blank"
        class="social"
      >
        <div class="social-icon">
          <i class="fa-brands fa-youtube"></i>
        </div>

        <div class="social-info">
          <span class="social-name">YouTube</span>
          <span class="social-handle">@auzatic</span>

        <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
      </a>

    </div>

    <div class="views">
      <i class="fa-regular fa-eye"></i>
      <span id="views">0</span>
      <span>profile views</span>
    </div>

  </section>

  <div class="footer">
    <a href="/">SAINTS N SINNERS</a>
  </div>

</main>


<script>
  /* =============================
     CURSOR GLOW
  ============================== */

  const cursorLight = document.getElementById("cursorLight");

  window.addEventListener("mousemove", (e) => {
    cursorLight.style.left = e.clientX + "px";
    cursorLight.style.top = e.clientY + "px";
  });


  /* =============================
     FAKE LOCAL VIEW COUNTER

     This remembers views on the
     user's browser only.

     A real global counter would
     require a database/API.
  ============================== */

  let views = localStorage.getItem("auzatic-profile-views");

  if (!views) {
    views = 1;
  } else {
    views = parseInt(views) + 1;
  }

  localStorage.setItem("auzatic-profile-views", views);

  const viewElement = document.getElementById("views");

  let displayedViews = 0;

  const viewAnimation = setInterval(() => {

    displayedViews += Math.max(
      1,
      Math.floor((views - displayedViews) / 10)
    );

    if (displayedViews >= views) {
      displayedViews = views;
      clearInterval(viewAnimation);
    }

    viewElement.textContent =
      displayedViews.toLocaleString();

  }, 25);


  /* =============================
     BACKGROUND PARTICLES
  ============================== */

  const canvas = document.getElementById("particles");
  const ctx = canvas.getContext("2d");

  let width;
  let height;

  const particleCount = 55;
  const particles = [];

  function resizeCanvas() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }

  window.addEventListener("resize", resizeCanvas);

  resizeCanvas();


  class Particle {

    constructor() {
      this.reset();
    }

    reset() {
      this.x = Math.random() * width;
      this.y = Math.random() * height;

      this.size =
        Math.random() * 1.4 + 0.3;

      this.speedX =
        (Math.random() - 0.5) * 0.12;

      this.speedY =
        (Math.random() - 0.5) * 0.12;

      this.opacity =
        Math.random() * 0.25 + 0.05;
    }

    update() {

      this.x += this.speedX;
      this.y += this.speedY;

      if (
        this.x < 0 ||
        this.x > width ||
        this.y < 0 ||
        this.y > height
      ) {
        this.reset();
      }

    }

    draw() {

      ctx.beginPath();

      ctx.arc(
        this.x,
        this.y,
        this.size,
        0,
        Math.PI * 2
      );

      ctx.fillStyle =
        `rgba(255,255,255,${this.opacity})`;

      ctx.fill();

    }

  }


  for (
    let i = 0;
    i < particleCount;
    i++
  ) {
    particles.push(
      new Particle()
    );
  }


  function animateParticles() {

    ctx.clearRect(
      0,
      0,
      width,
      height
    );

    particles.forEach(
      particle => {
        particle.update();
        particle.draw();
      }
    );

    requestAnimationFrame(
      animateParticles
    );

  }

  animateParticles();


  /* =============================
     BUTTON TILT / MOTION
  ============================== */

  document
    .querySelectorAll(".social")
    .forEach(button => {

      button.addEventListener(
        "mousemove",
        e => {

          const rect =
            button.getBoundingClientRect();

          const x =
            e.clientX -
            rect.left -
            rect.width / 2;

          button.style.transform =
            `translateY(-2px)
             translateX(${x * 0.006}px)`;

        }
      );

      button.addEventListener(
        "mouseleave",
        () => {
          button.style.transform = "";
        }
      );

    });
</script>

</body>
</html>

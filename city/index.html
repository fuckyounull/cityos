<script>
const USER_ID='1215522544564703323';
const LANYARD=`https://api.lanyard.rest/v1/users/${USER_ID}`;
const $=id=>document.getElementById(id);
const statusColors={online:'#35ff8a',idle:'#ffd65b',dnd:'#ff416d',offline:'#747f8d'};

const BADGES=[
  {flag:1,name:'Staff',icon:'https://cdn.discordapp.com/badge-icons/5e74e9b61934fc1f67c65515d1f7e60d.png'},
  {flag:2,name:'Partnered Server Owner',icon:'https://cdn.discordapp.com/badge-icons/3f9748e53446a137a052f3454e2de41e.png'},

  {flag:8,name:'Bug Hunter Level 1',icon:'https://cdn.discordapp.com/badge-icons/2717692c7dca7289b35297368a940dd0.png'},
  {flag:64,name:'HypeSquad Bravery',icon:'https://cdn.discordapp.com/badge-icons/8a88d63823d8a71cd5e390baa45efa02.png'},
  {flag:128,name:'HypeSquad Brilliance',icon:'https://cdn.discordapp.com/badge-icons/011940fd013da3f7fb926e4a1cd2e618.png'},
  {flag:256,name:'HypeSquad Balance',icon:'https://cdn.discordapp.com/badge-icons/3aa41de486fa12454c3761e8e223442e.png'},
  {flag:512,name:'Early Supporter',icon:'https://cdn.discordapp.com/badge-icons/7060786766c9c840eb3019e725d2b358.png'},
  {flag:16384,name:'Bug Hunter Level 2',icon:'https://cdn.discordapp.com/badge-icons/848f79194d4be5ff5f81505cbd0ce1e6.png'},
  {flag:65536,name:'Verified Bot',icon:'https://cdn.discordapp.com/badge-icons/f2459b691ac7453ed6039bbcfaccbfcd.png'},
  {flag:131072,name:'Early Verified Bot Developer',icon:'https://cdn.discordapp.com/badge-icons/6df5892e0f35b051f8b61eace34f4967.png'},
  {flag:262144,name:'Moderator Programs Alumni',icon:'https://cdn.discordapp.com/badge-icons/fee1624003e2fee35cb398e125dc479b.png'},
  {flag:4194304,name:'Active Developer',icon:'https://cdn.discordapp.com/badge-icons/6bdc42827a38498929a4920da12695d9.png'}
];

function avatarUrl(user){
  if(!user?.id || !user?.avatar) return '';
  const ext=user.avatar.startsWith('a_')?'gif':'png';
  return `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${ext}?size=512`;
}
function renderBadges(flags){
  const wrap=$('badges');wrap.replaceChildren();
  BADGES.filter(b=>(flags & b.flag)===b.flag).forEach(b=>{
    const img=document.createElement('img');img.className='badge';img.src=b.icon;img.alt=b.name;img.title=b.name;img.loading='eager';wrap.appendChild(img);
  });
}
async function loadLanyard(){
  try{
    const res=await fetch(LANYARD,{cache:'no-store'});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const json=await res.json();
    if(!json?.success || !json?.data) throw new Error('No Lanyard data returned');

    const data=json.data;
    const user=data.discord_user || {};
    const status=data.discord_status || 'offline';
    const avatar=avatarUrl(user);

    if(avatar){$('avatar').src=avatar;$('songAvatar').src=avatar;$('dynamicFavicon').href=avatar;}
    $('displayName').textContent=user.global_name || user.display_name || user.username || 'city';
    document.documentElement.style.setProperty('--status',statusColors[status] || statusColors.offline);
    renderBadges(Number(user.public_flags || 0));

    if(user.avatar_decoration_data?.asset){
      $('avatarDecoration').src=`https://cdn.discordapp.com/avatar-decoration-presets/${user.avatar_decoration_data.asset}.png?size=240&passthrough=true`;
      $('avatarDecoration').style.display='block';
    }else $('avatarDecoration').style.display='none';

    const activities=Array.isArray(data.activities)?data.activities:[];
    const custom=activities.find(a=>a.type===4);
    const activity=activities.find(a=>a.type!==4);
    if(data.listening_to_spotify && data.spotify){
      $('activityTitle').textContent='Spotify';
      $('activityText').textContent=`${data.spotify.song || 'Listening'}${data.spotify.artist ? ' — '+data.spotify.artist : ''}`;
    }else if(activity){
      $('activityTitle').textContent=activity.name || 'Activity';
      $('activityText').textContent=[activity.details,activity.state].filter(Boolean).join(' — ') || 'active now';
    }else if(custom?.state){
      $('activityTitle').textContent='Status';
      $('activityText').textContent=custom.state;
    }else{
      $('activityTitle').textContent='Lanyard';
      $('activityText').textContent=status==='offline'?'nothing public right now':'online now';
    }
  }catch(err){
    console.error('Lanyard:',err);
    $('activityTitle').textContent='Lanyard';
    $('activityText').textContent='profile data unavailable';
  }
}
loadLanyard();
setInterval(loadLanyard,30000);
$('avatar').addEventListener('load',()=>{if(!$('songAvatar').src)$('songAvatar').src=$('avatar').src});

const gate=$('enterGate');
const song=$('profileSong');
const player=$('musicPlayer');
const toggle=$('musicToggle');
const state=$('musicState');
const fill=$('musicFill');
song.volume=.72;

function syncPlayer(){
  const playing=!song.paused&&!song.ended;
  player.classList.toggle('playing',playing);
  toggle.textContent=playing?'❚❚':'▶';
  state.textContent=playing?'now playing':'paused';
}
async function tryPlay(){
  try{
    await song.play();
    syncPlayer();
    return true;
  }catch(err){
    console.warn('Audio play blocked/unavailable:',err);
    state.textContent=song.error?'glokies.mp3 unavailable':'tap play';
    syncPlayer();
    return false;
  }
}


/* Enter always enters. Music is attempted separately and can never trap the page. */
$('enterBtn').addEventListener('click',async()=>{
  gate.classList.add('off');
  await tryPlay();
});
toggle.addEventListener('click',()=>song.paused?tryPlay():song.pause());
song.addEventListener('play',syncPlayer);
song.addEventListener('pause',syncPlayer);
song.addEventListener('ended',syncPlayer);
song.addEventListener('loadstart',()=>{state.textContent='loading'});
song.addEventListener('canplay',()=>{if(song.paused)state.textContent='ready'});
song.addEventListener('error',()=>{state.textContent='glokies.mp3 not found';toggle.textContent='▶'});
song.addEventListener('timeupdate',()=>{fill.style.width=(song.duration?song.currentTime/song.duration*100:0)+'%'});
$('musicProgress').addEventListener('click',e=>{if(song.duration){const r=e.currentTarget.getBoundingClientRect();song.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*song.duration}});

$('copyId').addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(USER_ID);$('copyId').textContent='copied';setTimeout(()=>$('copyId').textContent='copy id',1000)}catch{}
});

addEventListener('pointermove',e=>{
  document.documentElement.style.setProperty('--mx',(e.clientX/innerWidth*100)+'%');
  document.documentElement.style.setProperty('--my',(e.clientY/innerHeight*100)+'%');
},{passive:true});

/* hidden: type CITY to toggle void mode */
let secretKeys='';
addEventListener('keydown',e=>{secretKeys=(secretKeys+e.key.toLowerCase()).slice(-4);if(secretKeys==='city'){document.body.classList.toggle('void');$('secret').classList.add('show');setTimeout(()=>$('secret').classList.remove('show'),1100)}});
/* hidden: triple-click the avatar */
let taps=0,tapTimer; $('avatar').addEventListener('click',()=>{taps++;clearTimeout(tapTimer);tapTimer=setTimeout(()=>taps=0,500);if(taps>=3){taps=0;$('secret').textContent='signal received';$('secret').classList.add('show');setTimeout(()=>{$('secret').classList.remove('show');$('secret').textContent='you found the void'},1000)}});
/* subtle cursor ghosts on desktop */
let lastGhost=0;addEventListener('pointermove',e=>{if(e.pointerType==='touch'||performance.now()-lastGhost<55)return;lastGhost=performance.now();const g=document.createElement('i');g.className='ghost';g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';document.body.appendChild(g);setTimeout(()=>g.remove(),850)},{passive:true});

(function title(){const t='city.exe';let i=1,d=false;document.title='c';function go(){if(!d){i=Math.min(t.length,i+1);document.title=t.slice(0,i);if(i===t.length){d=true;return setTimeout(go,1100)}return setTimeout(go,170)}i=Math.max(1,i-1);document.title=t.slice(0,i);if(i===1){d=false;return setTimeout(go,440)}setTimeout(go,95)}setTimeout(go,170)})();
</script>
</body>
